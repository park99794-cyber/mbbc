<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBBC WORLD</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
            background: #0f1419;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 500px;
            min-height: 100vh;
            background: linear-gradient(180deg, #1a2235 0%, #0f1520 100%);
        }

        /* PC 차단 */
        #pcBlockScreen {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            text-align: center;
        }
        .block-title {
            font-size: 34px; font-weight: 900; color: #fff;
            letter-spacing: 5px; margin-bottom: 30px;
        }
        .block-msg {
            color: #fca5a5; font-size: 16px; font-weight: 600; line-height: 2;
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 14px; padding: 24px 28px;
        }

        /* 뷰어 */
        #viewerScreen {
            display: none;
            padding: 28px 18px 40px;
        }

        /* 회사 정보 박스 */
        .info-box {
            background: linear-gradient(135deg, #243044 0%, #1a2438 100%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 18px;
            padding: 28px 20px 22px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .info-title {
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-shadow: 0 2px 16px rgba(0,0,0,0.6);
        }

        .info-branch {
            font-size: 17px;
            font-weight: 700;
            color: #d1dce8;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .info-row {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .icon-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .info-id {
            color: #ffffff;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1px;
        }

        .info-japan {
            font-size: 17px;
            font-weight: 800;
            color: #fde68a;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* 영상 버튼 */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 36px;
        }

        .vid-btn {
            width: 100%;
            padding: 26px 24px;
            border-radius: 14px;
            border: none;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s ease;
            letter-spacing: 1px;
        }

        .vid-btn.dark {
            background: linear-gradient(135deg, #111827 0%, #0a0f1a 100%);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .vid-btn.dark:not(:disabled):hover {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
        }

        .vid-btn.navy {
            background: linear-gradient(135deg, #1e3a5f 0%, #12253d 100%);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .vid-btn.navy:not(:disabled):hover {
            background: linear-gradient(135deg, #274c7a 0%, #1a3354 100%);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        .vid-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .dot {
            display: inline-block;
            width: 13px; height: 13px;
            border-radius: 50%;
            background: #475569;
            margin-right: 14px;
            vertical-align: middle;
            position: relative; top: -1px;
        }
        .dot.on {
            background: radial-gradient(circle at 35% 35%, #ff5555, #cc0000);
            box-shadow: 0 0 10px rgba(255,50,50,0.9), 0 0 22px rgba(200,0,0,0.5);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 10px rgba(255,50,50,0.9), 0 0 22px rgba(200,0,0,0.5); }
            50%      { box-shadow: 0 0 18px rgba(255,50,50,1), 0 0 36px rgba(200,0,0,0.8); }
        }

        .footer {
            text-align: center;
            color: #f6c90e;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 6px;
            padding-bottom: 10px;
            text-shadow: 0 0 20px rgba(246,201,14,0.4);
        }

        /* 로딩 */
        #loading {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #loading[style*="block"] { display: flex !important; }
        #loading::after {
            content: "로딩중...";
            color: #fff; font-size: 20px; font-weight: 700;
            animation: fade 1.5s ease-in-out infinite;
        }
        @keyframes fade {
            0%,100% { opacity: 0.2; }
            50%      { opacity: 1; }
        }
    </style>
</head>

    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    const isPC = () => !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
    const loading = v => document.getElementById("loading").style.display = v ? "block" : "none";

    (async () => {
        if (isPC()) {
            try {
                const s = await getDoc(doc(db, "promo_settings_kor", "pcAccess"));
                if (s.exists() && s.data().enabled === false) {
                    document.getElementById("pcBlockScreen").style.display = "flex";
                    return;
                }
            } catch(e) {}
        }
        document.getElementById("viewerScreen").style.display = "block";
        for (let i = 1; i <= 4; i++) {
            try {
                const d = await getDoc(doc(db, "promo_videos_kor", "session" + i));
                if (d.exists() && d.data().link) {
                    document.getElementById("btn_session" + i).disabled = false;
                    document.getElementById("dot_session" + i).classList.add("on");
                }
            } catch(e) {}
        }
    })();

    window.playVideo = async function(id) {
        if (isPC()) {
            try {
                const s = await getDoc(doc(db, "promo_settings_kor", "pcAccess"));
                if (s.exists() && s.data().enabled === false) {
                    alert("컴퓨터에서의 재생이 제한되어 있습니다.\n📱 모바일에서 이용해주세요.");
                    return;
                }
            } catch(e) {}
        }
        loading(true);
        try {
            const d = await getDoc(doc(db, "promo_videos_kor", id));
            if (d.exists() && d.data().link) {
                window.open(d.data().link.replace("/preview","/view"), "_blank");
            } else {
                alert("동영상이 아직 준비되지 않았습니다");
            }
        } catch(e) { alert("재생 중 오류가 발생했습니다"); }
        loading(false);
    };
</script>
