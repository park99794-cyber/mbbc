<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>MBBC WORLD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #8a8a8a;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* 로그인 화면 */
        .login-screen {
            background: 
                linear-gradient(rgba(20,15,10,0.7), rgba(15,10,5,0.85)),
                radial-gradient(circle at 30% 20%, rgba(180,150,120,0.3) 0%, transparent 50%),
                linear-gradient(135deg, #3e2723 0%, #5d4037 50%, #4e342e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            position: relative;
        }

        .login-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 70% 30%, rgba(255,215,0,0.05) 0%, transparent 30%),
                radial-gradient(circle at 30% 70%, rgba(139,69,19,0.1) 0%, transparent 40%);
            pointer-events: none;
        }

        .login-title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 2px 10px rgba(0,0,0,0.5),
                0 0 30px rgba(255,215,0,0.3),
                3px 3px 0px rgba(0,0,0,0.3);
            margin-bottom: 100px;
            letter-spacing: 6px;
            z-index: 1;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            z-index: 1;
        }

        .login-label {
            color: #f5f5f5;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        .login-input {
            width: 100%;
            padding: 25px 20px;
            font-size: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .login-input:focus {
            border-color: rgba(255,215,0,0.6);
            background: rgba(0,0,0,0.7);
            box-shadow: 0 8px 30px rgba(255,215,0,0.2);
        }

        .login-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .login-btn {
            width: 100%;
            padding: 22px;
            margin-top: 25px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .error-msg {
            color: #ff6b6b;
            background: rgba(255,107,107,0.15);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255,107,107,0.3);
            line-height: 1.6;
        }

        /* 메인 화면 공통 */
        .main-screen {
            display: none;
            min-height: 100vh;
        }

        /* 헤더 - 입체 효과 */
        .header {
            background: #8a8a8a;
            padding: 25px 20px 20px;
            text-align: center;
        }

        .header-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #e0e0e0;
            text-shadow: 
                2px 2px 0px #5a5a5a,
                3px 3px 2px rgba(0,0,0,0.4),
                -1px -1px 0px #aaa;
        }

        .mode-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 20px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(231,76,60,0.4);
            letter-spacing: 2px;
        }

        .mode-badge::before {
            content: '●';
            margin-right: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .logout-btn {
            margin-top: 12px;
            padding: 8px 25px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* 관리자 화면 */
        .admin-screen {
            padding: 20px;
            background: #8a8a8a;
            min-height: calc(100vh - 140px);
        }

        .admin-section {
            background: #6a6a6a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #8a8a8a;
        }

        .id-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .id-item {
            background: #4a4a4a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .id-text {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .delete-btn {
            padding: 8px 20px;
            background: #d63031;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .create-btn {
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .video-upload-btn {
            width: 100%;
            padding: 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .page-btn {
            padding: 8px 15px;
            background: #5a5a5a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .page-btn.active {
            background: #3a3a3a;
        }

        /* 회원 화면 - A_B-2.png 스타일 */
        .viewer-screen {
            padding: 25px 20px;
            background: #8a8a8a;
            min-height: calc(100vh - 140px);
        }

        .category-btn {
            width: 100%;
            padding: 22px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #3e4e5e 0%, #4a5a6a 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.2s;
            border: 3px solid rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
        }

        .category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .category-btn.main {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            font-size: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .pro-gambler {
            text-align: center;
            color: #a8dadc;
            font-size: 38px;
            font-weight: 900;
            margin-top: 40px;
            text-shadow: 2px 2px 8px rgba(168, 218, 220, 0.6);
            letter-spacing: 4px;
        }

        /* 카테고리 상세 화면 */
        .category-detail {
            display: none;
        }

        .detail-title {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            padding: 24px;
            margin: 25px 20px 25px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .back-arrow {
            padding: 12px 25px;
            background: #5a5a5a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 20px 15px;
        }

        .video-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .video-item-btn {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            line-height: 1.4;
        }

        .video-item-btn:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            transform: translateY(-2px);
        }

        /* 동영상 관리 화면 */
        .video-manage {
            display: none;
            padding: 20px;
            background: #1a1a2e;
            min-height: calc(100vh - 140px);
        }

        .video-manage-item {
            background: #2c3e50;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .video-manage-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .link-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1a2332;
            border: 2px solid #34495e;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .link-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .save-btn {
            padding: 10px 25px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }

        .remove-btn {
            padding: 10px 25px;
            background: #d63031;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* 로딩 */
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            z-index: 10001;
        }

        /* 스크롤바 */
        .id-list::-webkit-scrollbar {
            width: 8px;
        }

        .id-list::-webkit-scrollbar-track {
            background: #4a4a4a;
            border-radius: 4px;
        }

        .id-list::-webkit-scrollbar-thumb {
            background: #8a8a8a;
            border-radius: 4px;
        }

        /* 반응형 */
        @media (max-width: 480px) {
            .login-title {
                font-size: 48px;
            }
            
            .category-btn {
                font-size: 20px;
                padding: 20px;
            }

            .header-title {
                font-size: 38px;
            }

            .pro-gambler {
                font-size: 34px;
            }
        }

        /* 토글 스위치 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e74c3c;
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #27ae60;
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 로그인 화면 -->
        <div id="loginScreen" class="login-screen">
            <div class="login-title">MBBC WORLD</div>
            <div class="login-box">
                <div class="login-label">ID</div>
                <input type="text" id="loginInput" class="login-input" placeholder="">
                <button onclick="login()" class="login-btn">로그인</button>
                <div id="loginError" class="error-msg" style="display:none;"></div>
            </div>
        </div>

        <!-- 관리자 메인 화면 -->
        <div id="adminScreen" class="main-screen">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
                <div class="mode-badge">SENDER MODE</div>
                <button onclick="logout()" class="logout-btn">로그아웃</button>
            </div>
            <div class="admin-screen">
                <div class="admin-section">
                    <div class="section-title">회원 ID 관리</div>
                    <div id="idList" class="id-list"></div>
                    <div class="pagination" id="pagination"></div>
                    <button onclick="createMemberId()" class="create-btn">새 ID 생성</button>
                </div>
                <div class="admin-section">
                    <div class="section-title">PC 접근 제어</div>
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 0;">
                        <span style="color: white; font-size: 18px; font-weight: 600;">컴퓨터용 동영상 재생</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="pcAccessToggle" onchange="togglePcAccess()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div id="pcAccessStatus" style="color: #fff; font-size: 14px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; text-align: center; margin-top: 10px;"></div>
                </div>
                <button onclick="showVideoManage()" class="video-upload-btn">동영상 업로드</button>
            </div>
        </div>

        <!-- 회원 메인 화면 -->
        <div id="viewerScreen" class="main-screen">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
                <button onclick="logout()" class="logout-btn">로그아웃</button>
            </div>
            <div class="viewer-screen">
                <button onclick="showCategory('education')" class="category-btn main">정기교육 동영상 4편</button>
                <button onclick="playVideo('banker')" class="category-btn">뱅커 충돌선 베팅법</button>
                <button onclick="playVideo('player')" class="category-btn">플레이어 충돌 베팅법</button>
                <button onclick="playVideo('shoe')" class="category-btn">슈 진행시 베팅법</button>
                <button onclick="playVideo('technical')" class="category-btn">기술적 옆줄 베팅법</button>
                <button onclick="playVideo('reverse')" class="category-btn">역수(가치) 베팅법</button>
                <button onclick="playVideo('online')" class="category-btn">온라인(에볼루션)관련</button>
                <div class="pro-gambler">PRO GAMBLER</div>
            </div>
        </div>

        <!-- 정기교육 상세 화면 -->
        <div id="educationDetail" class="main-screen category-detail">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
            </div>
            <button onclick="backToMain()" class="back-arrow">← 돌아가기</button>
            <div class="detail-title">정기교육 동영상 4편</div>
            <div class="video-list">
                <button onclick="playVideo('edu1')" class="video-item-btn">1편: 전략슈의 의미-짝수선.충돌선</button>
                <button onclick="playVideo('edu2')" class="video-item-btn">2편: 뱅커 충돌선-플 충돌선</button>
                <button onclick="playVideo('edu3')" class="video-item-btn">3편: 뱅,플 충돌선의 강한힘 감별법</button>
                <button onclick="playVideo('edu4')" class="video-item-btn">4편: 기술적 옆줄-역수</button>
            </div>
        </div>

        <!-- 동영상 관리 화면 -->
        <div id="videoManage" class="main-screen video-manage">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
                <div class="mode-badge">SENDER MODE</div>
            </div>
            <button onclick="backToAdmin()" class="back-arrow">← 돌아가기</button>
            
            <div style="padding: 0 0 25px 0;">
                <div class="video-manage-item">
                    <div class="video-manage-title">정기교육 1편</div>
                    <input type="text" id="link_edu1" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('edu1')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('edu1')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">정기교육 2편</div>
                    <input type="text" id="link_edu2" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('edu2')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('edu2')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">정기교육 3편</div>
                    <input type="text" id="link_edu3" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('edu3')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('edu3')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">정기교육 4편</div>
                    <input type="text" id="link_edu4" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('edu4')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('edu4')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">뱅커 충돌선 베팅법</div>
                    <input type="text" id="link_banker" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('banker')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('banker')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">플레이어 충돌 베팅법</div>
                    <input type="text" id="link_player" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('player')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('player')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">슈 진행시 베팅법</div>
                    <input type="text" id="link_shoe" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('shoe')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('shoe')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">기술적 옆줄 베팅법</div>
                    <input type="text" id="link_technical" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('technical')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('technical')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">역수(가치) 베팅법</div>
                    <input type="text" id="link_reverse" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('reverse')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('reverse')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">온라인(에볼루션)관련</div>
                    <input type="text" id="link_online" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('online')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('online')" class="remove-btn">삭제</button>
                </div>
            </div>
        </div>

        <!-- 로딩 -->
        <div id="loading" class="loading">로딩중...</div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, deleteDoc, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyB-hpuvsuxfBEbJ7fL3tjscUJRJL13hztA",
            authDomain: "mbbc-movie.firebaseapp.com",
            projectId: "mbbc-movie",
            storageBucket: "mbbc-movie.firebasestorage.app",
            messagingSenderId: "915982695424",
            appId: "1:915982695424:web:9ab504e302c8bc1b012ce5",
            measurementId: "G-L747LKVTPR"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 전역 변수
        window.db = db;
        window.currentUser = null;
        window.currentPage = 1;
        window.itemsPerPage = 10;

        // 관리자 ID
        const ADMIN_IDS = ['MBBC-25213', 'MBBC-25216'];

        // 🔐 기기 고유값 생성 함수 (아이폰 Safari 호환)
        function generateDeviceId() {
            try {
                // 기존 deviceId가 localStorage에 있으면 재사용
                let deviceId = null;
                
                // localStorage 접근 시도 (Safari 사생활 보호 모드에서 에러 발생 가능)
                try {
                    deviceId = localStorage.getItem('mbbc_device_id');
                    if (deviceId) {
                        return deviceId;
                    }
                } catch (storageError) {
                    console.warn('localStorage 접근 불가:', storageError);
                }

                // 새로운 deviceId 생성
                const userAgent = navigator.userAgent;
                const screenResolution = `${screen.width}x${screen.height}`;
                const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                const language = navigator.language;
                const platform = navigator.platform;
                const randomSeed = Math.random().toString(36).substring(2, 15);
                
                const fingerprint = `${userAgent}-${screenResolution}-${timezone}-${language}-${platform}-${randomSeed}`;
                
                // Base64 인코딩 (한글/특수문자 대응)
                try {
                    // UTF-8 인코딩 후 Base64 변환
                    const encoder = new TextEncoder();
                    const data = encoder.encode(fingerprint);
                    const base64 = btoa(String.fromCharCode.apply(null, data));
                    deviceId = base64.substring(0, 32);
                } catch (encodeError) {
                    // btoa 실패 시 간단한 해시 사용
                    console.warn('Base64 인코딩 실패, 대체 방법 사용:', encodeError);
                    let hash = 0;
                    for (let i = 0; i < fingerprint.length; i++) {
                        const char = fingerprint.charCodeAt(i);
                        hash = ((hash << 5) - hash) + char;
                        hash = hash & hash;
                    }
                    deviceId = Math.abs(hash).toString(36).substring(0, 32);
                }
                
                // localStorage에 저장 시도 (실패해도 계속 진행)
                try {
                    localStorage.setItem('mbbc_device_id', deviceId);
                } catch (storageError) {
                    console.warn('localStorage 저장 실패 (계속 진행):', storageError);
                    // sessionStorage 시도
                    try {
                        sessionStorage.setItem('mbbc_device_id', deviceId);
                    } catch (e) {
                        console.warn('sessionStorage도 실패:', e);
                    }
                }
                
                return deviceId;
            } catch (error) {
                console.error('기기 ID 생성 오류:', error);
                // 최후의 대체 방안: 랜덤 ID
                return 'FALLBACK-' + Date.now() + '-' + Math.random().toString(36).substring(2, 10);
            }
        }

        // 로그인
        window.login = async function() {
            const input = document.getElementById('loginInput').value.trim().toUpperCase();
            const errorDiv = document.getElementById('loginError');
            
            if (!input) {
                errorDiv.textContent = '아이디를 입력하세요';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            showLoading(true);

            try {
                // 관리자 로그인 (기기 제한 없음)
                if (ADMIN_IDS.includes(input)) {
                    window.currentUser = { id: input, role: 'admin' };
                    showScreen('adminScreen');
                    await loadMemberIds();
                    await loadVideoLinks();
                    await loadPcAccessSetting();
                } else {
                    // 🔐 회원 로그인 (기기 고정 체크)
                    const memberDoc = await getDoc(doc(db, 'members', input));
                    
                    if (!memberDoc.exists()) {
                        errorDiv.textContent = '존재하지 않는 아이디입니다';
                        errorDiv.style.display = 'block';
                        showLoading(false);
                        return;
                    }

                    const memberData = memberDoc.data();
                    
                    // 기기 ID 생성 시도
                    let currentDeviceId;
                    try {
                        currentDeviceId = generateDeviceId();
                    } catch (deviceError) {
                        console.error('기기 ID 생성 실패:', deviceError);
                        errorDiv.innerHTML = '⚠️ 기기 인증에 문제가 발생했습니다.<br><br>Safari 설정에서<br>"사이트 간 추적 방지"를 확인해주세요.<br><br>또는 관리자에게 문의하세요.';
                        errorDiv.style.display = 'block';
                        showLoading(false);
                        return;
                    }

                    // 첫 로그인 (기기 등록)
                    if (!memberData.deviceId) {
                        await setDoc(doc(db, 'members', input), {
                            createdAt: memberData.createdAt,
                            deviceId: currentDeviceId,
                            registeredAt: new Date().toISOString()
                        });
                        
                        window.currentUser = { id: input, role: 'viewer' };
                        showScreen('viewerScreen');
                        await loadVideoLinks();
                        
                        alert('✅ 이 기기가 등록되었습니다.\n앞으로 이 기기에서만 로그인 가능합니다.');
                    } 
                    // 기존 기기에서 로그인
                    else if (memberData.deviceId === currentDeviceId) {
                        window.currentUser = { id: input, role: 'viewer' };
                        showScreen('viewerScreen');
                        await loadVideoLinks();
                    } 
                    // 다른 기기에서 로그인 시도 (차단!)
                    else {
                        errorDiv.innerHTML = '⚠️ 이 ID는 다른 기기에 등록되어 있습니다.<br><br>새 기기에서 사용하려면<br>관리자에게 문의하여 새 ID를 발급받으세요.';
                        errorDiv.style.display = 'block';
                        showLoading(false);
                        return;
                    }
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.innerHTML = '⚠️ 로그인 중 오류가 발생했습니다.<br><br>인터넷 연결을 확인하거나<br>잠시 후 다시 시도해주세요.';
                errorDiv.style.display = 'block';
            }

            showLoading(false);
        };

        // 로그아웃
        window.logout = function() {
            window.currentUser = null;
            document.getElementById('loginInput').value = '';
            showScreen('loginScreen');
        };

        // 회원 ID 생성
        window.createMemberId = async function() {
            showLoading(true);
            try {
                const newId = 'MBBC-' + generateRandomId();
                await setDoc(doc(db, 'members', newId), {
                    createdAt: new Date().toISOString()
                    // deviceId는 첫 로그인 시 자동 등록됨
                });
                alert('새 ID 생성 완료:\n\n' + newId);
                await loadMemberIds();
            } catch (error) {
                console.error('Create error:', error);
                alert('ID 생성 중 오류가 발생했습니다');
            }
            showLoading(false);
        };

        // 회원 ID 삭제
        window.deleteMemberId = async function(memberId) {
            if (!confirm(memberId + '를 삭제하시겠습니까?')) return;
            
            showLoading(true);
            try {
                await deleteDoc(doc(db, 'members', memberId));
                alert('삭제 완료');
                await loadMemberIds();
            } catch (error) {
                console.error('Delete error:', error);
                alert('삭제 중 오류가 발생했습니다');
            }
            showLoading(false);
        };

        // 회원 ID 목록 로드
        window.loadMemberIds = async function() {
            try {
                const membersSnapshot = await getDocs(collection(db, 'members'));
                const members = [];
                membersSnapshot.forEach(doc => {
                    members.push(doc.id);
                });
                members.sort();

                const totalPages = Math.ceil(members.length / window.itemsPerPage);
                const start = (window.currentPage - 1) * window.itemsPerPage;
                const end = start + window.itemsPerPage;
                const currentMembers = members.slice(start, end);

                const listDiv = document.getElementById('idList');
                listDiv.innerHTML = '';
                
                if (currentMembers.length === 0) {
                    listDiv.innerHTML = '<div style="color: white; text-align: center; padding: 30px; opacity: 0.7;">등록된 회원이 없습니다</div>';
                } else {
                    currentMembers.forEach(id => {
                        const item = document.createElement('div');
                        item.className = 'id-item';
                        item.innerHTML = `
                            <span class="id-text">${id}</span>
                            <button class="delete-btn" onclick="deleteMemberId('${id}')">삭제</button>
                        `;
                        listDiv.appendChild(item);
                    });
                }

                const paginationDiv = document.getElementById('pagination');
                paginationDiv.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'page-btn' + (i === window.currentPage ? ' active' : '');
                    btn.textContent = i;
                    btn.onclick = () => {
                        window.currentPage = i;
                        loadMemberIds();
                    };
                    paginationDiv.appendChild(btn);
                }
            } catch (error) {
                console.error('Load members error:', error);
            }
        };

        // 동영상 링크 저장
        window.saveVideoLink = async function(videoId) {
            const input = document.getElementById('link_' + videoId);
            let link = input.value.trim();
            
            if (!link) {
                alert('링크를 입력하세요');
                return;
            }

            link = convertToEmbedLink(link);

            showLoading(true);
            try {
                await setDoc(doc(db, 'videos', videoId), {
                    link: link,
                    updatedAt: new Date().toISOString()
                });
                alert('저장 완료');
            } catch (error) {
                console.error('Save error:', error);
                alert('저장 중 오류가 발생했습니다');
            }
            showLoading(false);
        };

        // 동영상 링크 삭제
        window.removeVideoLink = async function(videoId) {
            if (!confirm('이 동영상 링크를 삭제하시겠습니까?')) return;

            showLoading(true);
            try {
                await setDoc(doc(db, 'videos', videoId), {
                    link: '',
                    updatedAt: new Date().toISOString()
                });
                document.getElementById('link_' + videoId).value = '';
                alert('삭제 완료');
            } catch (error) {
                console.error('Remove error:', error);
                alert('삭제 중 오류가 발생했습니다');
            }
            showLoading(false);
        };

        // 동영상 링크 로드
        window.loadVideoLinks = async function() {
            try {
                const videoIds = ['edu1', 'edu2', 'edu3', 'edu4', 'banker', 'player', 'shoe', 'technical', 'reverse', 'online'];
                for (const id of videoIds) {
                    const videoDoc = await getDoc(doc(db, 'videos', id));
                    if (videoDoc.exists() && videoDoc.data().link) {
                        const input = document.getElementById('link_' + id);
                        if (input) {
                            input.value = videoDoc.data().link;
                        }
                    }
                }
            } catch (error) {
                console.error('Load videos error:', error);
            }
        };

        // 동영상 재생 - 새 창에서 Google Drive로 직접 열기
        window.playVideo = async function(videoId) {
            showLoading(true);
            try {
                // PC 접근 제어 확인 (회원만 체크)
                if (window.currentUser && window.currentUser.role === 'viewer') {
                    const isPC = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
                    
                    if (isPC) {
                        const settingDoc = await getDoc(doc(db, 'settings', 'pcAccess'));
                        if (settingDoc.exists() && settingDoc.data().enabled === false) {
                            showLoading(false);
                            alert('현재 컴퓨터에서의 동영상 재생이 제한되어 있습니다.\n모바일에서 이용해주세요.');
                            return;
                        }
                    }
                }

                const videoDoc = await getDoc(doc(db, 'videos', videoId));
                if (videoDoc.exists() && videoDoc.data().link) {
                    let link = videoDoc.data().link;
                    
                    // preview 링크를 view 링크로 변환 (더 나은 재생 경험)
                    link = link.replace('/preview', '/view');
                    
                    // 새 창에서 Google Drive 열기
                    window.open(link, '_blank');
                } else {
                    alert('동영상이 아직 업로드되지 않았습니다');
                }
            } catch (error) {
                console.error('Play error:', error);
                alert('동영상 재생 중 오류가 발생했습니다');
            }
            showLoading(false);
        };

        // 카테고리 보기
        window.showCategory = function(category) {
            if (category === 'education') {
                document.getElementById('viewerScreen').style.display = 'none';
                document.getElementById('educationDetail').style.display = 'block';
            }
        };

        // 메인으로 돌아가기
        window.backToMain = function() {
            document.getElementById('educationDetail').style.display = 'none';
            document.getElementById('viewerScreen').style.display = 'block';
        };

        // 동영상 관리 화면 보기
        window.showVideoManage = function() {
            document.getElementById('adminScreen').style.display = 'none';
            document.getElementById('videoManage').style.display = 'block';
        };

        // 관리자 화면으로 돌아가기
        window.backToAdmin = function() {
            document.getElementById('videoManage').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'block';
        };

        // 화면 전환
        function showScreen(screenId) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminScreen').style.display = 'none';
            document.getElementById('viewerScreen').style.display = 'none';
            document.getElementById('educationDetail').style.display = 'none';
            document.getElementById('videoManage').style.display = 'none';
            document.getElementById(screenId).style.display = 'block';
        }

        // 로딩 표시
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // 랜덤 ID 생성
        function generateRandomId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 5; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        // Google Drive 링크 변환
        function convertToEmbedLink(link) {
            const match = link.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match) {
                return `https://drive.google.com/file/d/${match[1]}/preview`;
            }
            return link;
        }

        // PC 접근 제어 설정 로드
        window.loadPcAccessSetting = async function() {
            try {
                const settingDoc = await getDoc(doc(db, 'settings', 'pcAccess'));
                const toggle = document.getElementById('pcAccessToggle');
                const status = document.getElementById('pcAccessStatus');
                
                if (settingDoc.exists()) {
                    const isEnabled = settingDoc.data().enabled !== false;
                    toggle.checked = isEnabled;
                    updatePcAccessStatus(isEnabled);
                } else {
                    toggle.checked = true;
                    updatePcAccessStatus(true);
                    await setDoc(doc(db, 'settings', 'pcAccess'), {
                        enabled: true,
                        updatedAt: new Date().toISOString()
                    });
                }
            } catch (error) {
                console.error('Load PC access setting error:', error);
            }
        };

        // PC 접근 제어 토글
        window.togglePcAccess = async function() {
            const toggle = document.getElementById('pcAccessToggle');
            const isEnabled = toggle.checked;
            
            showLoading(true);
            try {
                await setDoc(doc(db, 'settings', 'pcAccess'), {
                    enabled: isEnabled,
                    updatedAt: new Date().toISOString()
                });
                updatePcAccessStatus(isEnabled);
                alert(isEnabled ? 'PC 접근이 허용되었습니다.' : 'PC 접근이 제한되었습니다.');
            } catch (error) {
                console.error('Toggle PC access error:', error);
                alert('설정 변경 중 오류가 발생했습니다');
                toggle.checked = !isEnabled;
            }
            showLoading(false);
        };

        // PC 접근 상태 표시 업데이트
        function updatePcAccessStatus(isEnabled) {
            const status = document.getElementById('pcAccessStatus');
            if (isEnabled) {
                status.textContent = '✓ 현재 컴퓨터에서 동영상 재생이 가능합니다';
                status.style.background = 'rgba(39,174,96,0.3)';
                status.style.border = '1px solid rgba(39,174,96,0.5)';
            } else {
                status.textContent = '✕ 현재 컴퓨터에서 동영상 재생이 제한됩니다 (모바일만 가능)';
                status.style.background = 'rgba(231,76,60,0.3)';
                status.style.border = '1px solid rgba(231,76,60,0.5)';
            }
        }

        // Enter 키 로그인
        document.getElementById('loginInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
