<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBBC WORLD - 중국지사</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #8a8a8a;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* 로그인 화면 */
        .login-screen {
            background: 
                linear-gradient(rgba(20,15,10,0.7), rgba(15,10,5,0.85)),
                radial-gradient(circle at 30% 20%, rgba(180,150,120,0.3) 0%, transparent 50%),
                linear-gradient(135deg, #3e2723 0%, #5d4037 50%, #4e342e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            position: relative;
        }

        .login-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 70% 30%, rgba(255,215,0,0.05) 0%, transparent 30%),
                radial-gradient(circle at 30% 70%, rgba(139,69,19,0.1) 0%, transparent 40%);
            pointer-events: none;
        }

        .login-title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                0 2px 10px rgba(0,0,0,0.5),
                0 0 30px rgba(255,215,0,0.3),
                3px 3px 0px rgba(0,0,0,0.3);
            margin-bottom: 100px;
            letter-spacing: 6px;
            z-index: 1;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            z-index: 1;
        }

        .login-label {
            color: #f5f5f5;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        .login-input {
            width: 100%;
            padding: 25px 20px;
            font-size: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .login-input:focus {
            border-color: rgba(255,215,0,0.6);
            background: rgba(0,0,0,0.7);
            box-shadow: 0 8px 30px rgba(255,215,0,0.2);
        }

        .login-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .login-btn {
            width: 100%;
            padding: 22px;
            margin-top: 25px;
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .error-msg {
            color: #ff6b6b;
            background: rgba(255,107,107,0.15);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 600;
            text-align: center;
            border: 1px solid rgba(255,107,107,0.3);
        }

        /* 메인 화면 공통 */
        .main-screen {
            display: none;
            min-height: 100vh;
        }

        /* 헤더 - 입체 효과 */
        .header {
            background: #8a8a8a;
            padding: 25px 20px 20px;
            text-align: center;
        }

        .header-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #e0e0e0;
            text-shadow: 
                2px 2px 0px #5a5a5a,
                3px 3px 2px rgba(0,0,0,0.4),
                -1px -1px 0px #aaa;
        }

        .mode-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 20px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(231,76,60,0.4);
            letter-spacing: 2px;
        }

        .mode-badge::before {
            content: '●';
            margin-right: 8px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .logout-btn {
            margin-top: 12px;
            padding: 8px 25px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* 관리자 화면 */
        .admin-screen {
            padding: 20px;
            background: #8a8a8a;
            min-height: calc(100vh - 140px);
        }

        .admin-section {
            background: #6a6a6a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #8a8a8a;
        }

        .id-list {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .id-item {
            background: #4a4a4a;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .id-text {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .delete-btn {
            padding: 8px 20px;
            background: #d63031;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .create-btn {
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .video-upload-btn {
            width: 100%;
            padding: 20px;
            background: #000;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .page-btn {
            padding: 8px 15px;
            background: #5a5a5a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .page-btn.active {
            background: #3a3a3a;
        }

        /* 회원 화면 - A_B-2.png 스타일 */
        .viewer-screen {
            padding: 25px 20px;
            background: #8a8a8a;
            min-height: calc(100vh - 140px);
        }

        .category-btn {
            width: 100%;
            padding: 22px;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #3e4e5e 0%, #4a5a6a 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 
                0 4px 8px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.1);
            transition: all 0.2s;
            border: 3px solid rgba(255,255,255,0.15);
            letter-spacing: 0.5px;
        }

        .category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        .category-btn.main {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            font-size: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 
                0 6px 12px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.15);
        }

        .pro-gambler {
            text-align: center;
            color: #a8dadc;
            font-size: 38px;
            font-weight: 900;
            margin-top: 40px;
            text-shadow: 2px 2px 8px rgba(168, 218, 220, 0.6);
            letter-spacing: 4px;
        }

        /* 카테고리 상세 화면 */
        .category-detail {
            display: none;
        }

        .detail-title {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            padding: 24px;
            margin: 25px 20px 25px;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            letter-spacing: 1px;
        }

        .back-arrow {
            padding: 12px 25px;
            background: #5a5a5a;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 20px 15px;
        }

        .video-list {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .video-item-btn {
            width: 100%;
            padding: 22px;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            line-height: 1.4;
        }

        .video-item-btn:hover {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            transform: translateY(-2px);
        }

        /* 동영상 관리 화면 */
        .video-manage {
            display: none;
            padding: 20px;
            background: #1a1a2e;
            min-height: calc(100vh - 140px);
        }

        .video-manage-item {
            background: #2c3e50;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .video-manage-title {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .link-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1a2332;
            border: 2px solid #34495e;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .link-input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .save-btn {
            padding: 10px 25px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }

        .remove-btn {
            padding: 10px 25px;
            background: #d63031;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* 동영상 팝업 플레이어 */
        .video-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #000;
            z-index: 99999;
            flex-direction: column;
            overflow: hidden;
        }
        .video-overlay.active {
            display: flex;
        }
        .video-close-btn {
            width: 100%;
            height: 55px;
            background: #222;
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: right;
            padding-right: 20px;
            flex-shrink: 0;
        }
        .video-iframe-wrap {
            width: 100%;
            flex: 1;
            overflow: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .video-iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
            display: block;
        }

        /* 로딩 */
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            z-index: 10001;
        }

        /* 스크롤바 */
        .id-list::-webkit-scrollbar {
            width: 8px;
        }

        .id-list::-webkit-scrollbar-track {
            background: #4a4a4a;
            border-radius: 4px;
        }

        .id-list::-webkit-scrollbar-thumb {
            background: #8a8a8a;
            border-radius: 4px;
        }

        /* 반응형 */
        @media (max-width: 480px) {
            .login-title {
                font-size: 48px;
            }
            
            .category-btn {
                font-size: 20px;
                padding: 20px;
            }

            .header-title {
                font-size: 38px;
            }

            .pro-gambler {
                font-size: 34px;
            }
        }

        /* 토글 스위치 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e74c3c;
            transition: .4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #27ae60;
        }

        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
    
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }
        input, textarea {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }
</style>
</head>
<body>
    <div class="container">
        <!-- 로그인 화면 -->
        <div id="loginScreen" class="login-screen">
            <div class="login-title">MBBC WORLD</div>
            <div class="login-box">
                <div class="login-label">ID</div>
                <input type="text" id="loginInput" class="login-input" placeholder="">
                <button onclick="login()" class="login-btn">로그인</button>
                <div id="loginError" class="error-msg" style="display:none;"></div>
            </div>
        </div>

        <!-- 관리자 메인 화면 -->
        <div id="adminScreen" class="main-screen">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
                <div class="mode-badge">SENDER MODE</div>
                <button onclick="logout()" class="logout-btn">로그아웃</button>
            </div>
            <div class="admin-screen">
                <div class="admin-section">
                    <div class="section-title">회원 ID 관리</div>
                    <div id="idList" class="id-list"></div>
                    <div class="pagination" id="pagination"></div>
                    <input type="text" id="customIdInput" placeholder="특정 ID 입력 (비우면 랜덤 생성)" style="width: 100%; padding: 15px; margin-bottom: 15px; font-size: 16px; border: 2px solid #8a8a8a; border-radius: 10px; background: #4a4a4a; color: white; text-align: center;">
                    <button onclick="createMemberId()" class="create-btn">새 ID 생성</button>
                </div>
                <div class="admin-section">
                    <div class="section-title">PC 접근 제어</div>
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 15px 0;">
                        <span style="color: white; font-size: 18px; font-weight: 600;">컴퓨터용 동영상 재생</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="pcAccessToggle" onchange="togglePcAccess()">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div id="pcAccessStatus" style="color: #fff; font-size: 14px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; text-align: center; margin-top: 10px;"></div>
                </div>
                <button onclick="showVideoManage()" class="video-upload-btn">동영상 업로드</button>
            </div>
        </div>

        <!-- 회원 메인 화면 -->
        <div id="viewerScreen" class="main-screen">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
                <button onclick="logout()" class="logout-btn">로그아웃</button>
            </div>
            <div class="viewer-screen">
                <button class="category-btn main" style="pointer-events:none; cursor:default;">专业教学教程</button>
                <button onclick="playVideo('v1')" class="category-btn">牌路—偶数线•冲突线</button>
                <button onclick="playVideo('v2')" class="category-btn">庄家冲突线—闲家冲突线</button>
                <button onclick="playVideo('v3')" class="category-btn">庄家•闲家冲突线的强势辨别法</button>
                <button onclick="playVideo('v4')" class="category-btn">技术性侧线（单跳）排排连图像</button>
                <button onclick="playVideo('v5')" class="category-btn">特别教学：非正规图像</button>
                <button onclick="playVideo('v6')" class="category-btn">Q &amp; A</button>
                <div class="pro-gambler">PRO GAMBLER</div>
            </div>
        </div>

        <!-- 정기교육 상세 화면 -->
        <div id="educationDetail" class="main-screen category-detail">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
            </div>
            <button onclick="backToMain()" class="back-arrow">← 돌아가기</button>
            <div class="detail-title">정기교육 동영상 4편</div>
            <div class="video-list">
                <button onclick="playVideo('edu1')" class="video-item-btn">1편: 전략슈의 의미-짝수선.충돌선</button>
                <button onclick="playVideo('edu2')" class="video-item-btn">2편: 뱅커 충돌선-플 충돌선</button>
                <button onclick="playVideo('edu3')" class="video-item-btn">3편: 뱅,플 충돌선의 강한힘 감별법</button>
                <button onclick="playVideo('edu4')" class="video-item-btn">4편: 기술적 옆줄-역수</button>
            </div>
        </div>

        <!-- 온라인 상세 화면 -->
        <div id="onlineDetail" class="main-screen category-detail">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
            </div>
            <button onclick="backToMainFromOnline()" class="back-arrow">← 돌아가기</button>
            <div class="detail-title">온라인(에볼루션)관련</div>
            <div class="video-list">
                <button onclick="playVideo('online1')" class="video-item-btn">온라인 관련</button>
                <button onclick="playVideo('online2')" class="video-item-btn">실시간교육 1</button>
                <button onclick="playVideo('online3')" class="video-item-btn">실시간교육 2</button>
            </div>
        </div>

        <!-- 동영상 관리 화면 -->
        <div id="videoManage" class="main-screen video-manage">
            <div class="header">
                <div class="header-title">MBBC WORLD</div>
                <div class="mode-badge">SENDER MODE</div>
            </div>
            <button onclick="backToAdmin()" class="back-arrow">← 돌아가기</button>
            
            <div style="padding: 0 0 25px 0;">
                <div class="video-manage-item">
                    <div class="video-manage-title">牌路—偶数线•冲突线</div>
                    <input type="text" id="link_v1" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('v1')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('v1')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">庄家冲突线—闲家冲突线</div>
                    <input type="text" id="link_v2" class="link-input" placeholder="Google Drive 공유 링크 입력">
                    <button onclick="saveVideoLink('v2')" class="save-btn">저장</button>
                    <button onclick="removeVideoLink('v2')" class="remove-btn">삭제</button>
                </div>

                <div class="video-manage-item">
                    <div class="video-manage-title">庄家•闲家冲突线的强势辨别法</div>
